name: Build Android app

on:
  push:
    branches: [main, claude/wonderful-galileo-axlxps]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK on the "android-latest" release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # 1. Test APK: everything unlocked, signed with the shared test key so it installs as an
      #    update over earlier test builds. This is what you sideload from the release page.
      - name: Build test APK
        run: |
          CHANNEL=test npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/AirGuitarHero.apk

      # 2. Google Play bundle: guitar free, other instruments via in-app purchase. Only built once
      #    your upload key is configured (see store/PLAY_STORE.md).
      - name: Decode upload key (if configured)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Google Play bundle (AAB)
        if: env.KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          CHANNEL=play npm run build
          npx cap sync android
          cd android
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../dist/AirGuitarHero-GooglePlay.aab

      - name: Also package as a zip (some phone browsers stall on raw .apk downloads)
        run: cd dist && zip -9 AirGuitarHero.zip AirGuitarHero.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirGuitarHero-${{ env.VERSION_NAME }}
          path: dist/

      - name: Publish to the "android-latest" release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Air Guitar Hero $VERSION_NAME (Android)" \
            --notes "Latest Android build from $GITHUB_SHA. On your phone, download AirGuitarHero.apk (or AirGuitarHero.zip, then extract it) and open the APK to install. Allow installing from your browser or Files app if asked."
